# ==========================================
# VISUALS & THEME (Giao diện & Cấu hình màu)
# ==========================================
# Đảm bảo tmux dùng zsh làm shell mặc định để giữ nguyên p10k và autocomplete
set-option -g default-shell /bin/zsh

# Kích hoạt hỗ trợ 256 màu và True Color
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# ==========================================
# KEYBINDINGS (Phím tắt)
# ==========================================
# Đổi phím Prefix mặc định từ Ctrl+b sang Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Phím tắt chia màn hình (Split panes): | chia dọc, - chia ngang
# Tự động giữ nguyên thư mục hiện tại khi chia pane mới
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Phím tắt tải lại cấu hình nhanh chóng (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message " Đã tải lại cấu hình Tmux!"

# Điều hướng giữa các Pane bằng các phím Vim (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Thay đổi kích thước Pane nhanh (Prefix + H/J/K/L, có thể nhấn giữ Prefix rồi ấn liên tục)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==========================================
# WINDOW & PANE MANAGEMENT (Quản lý Cửa sổ)
# ==========================================
# Bật hỗ trợ chuột (click chọn pane, kéo thả để resize)
set -g mouse on

# Index của cửa sổ và pane bắt đầu từ 1 thay vì 0
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Bật phím tắt hệ Vim khi cuộn chuột và copy text (Copy Mode)
setw -g mode-keys vi

# ==========================================
# STATUS BAR (Đồng bộ nền tối + Thuần Text)
# ==========================================
set -g status-interval 5     # Tốc độ cập nhật 5 giây để giảm tải CPU

# Nền tối đồng nhất (#1a1b26) cho toàn bộ thanh dưới cùng
set-option -g status-style bg="#1a1b26",fg="#c0caf5"

set -g status-left-length 50
set -g status-right-length 250

# GÓC TRÁI: Tên Session bọc trong ngoặc vuông
set -g status-left "#[fg=yellow,bg=#1a1b26,bold] [#S] "

# GÓC PHẢI: Thuần text cho các thông số, phân cách bằng dấu gạch đứng (|)
set -g status-right "#[fg=#c0caf5,bg=#1a1b26]CPU: #(cut -d' ' -f1-3 /proc/loadavg) | RAM: #(free -m | awk '/^Mem:/ {print $3\"MB\"}') | BT: #(bluetoothctl show 2>/dev/null | grep -q 'Powered: yes' && echo 'ON' || echo 'OFF') | WIFI: #(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep '^yes' | cut -d: -f2) | BAT: #(acpi 2>/dev/null | awk '{print $4}' | tr -d ',') #[fg=yellow,bg=#1a1b26,bold] %A, %d/%m/%Y %H:%M "

# ĐỊNH DẠNG TAB: 
# Tab bình thường
setw -g window-status-format " #[fg=#a9b1d6,bg=#1a1b26] #I:#W "
# Tab đang mở (Sáng màu vàng, bọc trong ngoặc vuông để nhấn mạnh)
setw -g window-status-current-format " #[fg=yellow,bg=#1a1b26,bold] [#I:#W] "

# ==========================================
# SESSION MANAGEMENT (Quản lý Phiên)
# ==========================================
set-option -g detach-on-destroy off
