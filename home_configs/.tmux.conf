# ==============================================================================
# 🎨 TMUX HYBRID PRO SUITE - YUTA EDITION
# ==============================================================================

# Dùng Zsh làm shell mặc định
set-option -g default-shell /bin/zsh

# Kích hoạt TrueColor 24-bit RGB & 256 màu
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",xterm-256color:RGB"

# Giảm delay phím Escape về 0 (cho Vim/Neovim siêu mượt)
set -s escape-time 0

# Bộ nhớ đệm cuộn trang 20,000 dòng
set -g history-limit 20000

# Chỉ số Tab và Pane bắt đầu từ 1
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Bật hỗ trợ chuột 100% (click chọn pane, kéo thả viền để resize, cuộn trang)
set -g mouse on
set -g focus-events on

# ==============================================================================
# ⌨️ DUAL PREFIX (HỖ TRỢ CẢ CTRL+A VÀ CTRL+B)
# ==============================================================================
# Tiền tố 1: Ctrl + a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Tiền tố 2: Ctrl + b
set-option -g prefix2 C-b
bind-key C-b send-prefix -2

# Tải lại cấu hình nhanh (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message " ✨ Đã tải lại cấu hình Tmux!"

# Mở Popup Bảng Hướng Dẫn Phím Tắt (Prefix + ? hoặc Prefix + /)
bind ? display-popup -E -w 96 -h 36 "tmux-help; echo ''; echo '  👉 Nhấn phím bất kỳ hoặc q để đóng cửa sổ này...'; read -n 1 -s"
bind / display-popup -E -w 96 -h 36 "tmux-help; echo ''; echo '  👉 Nhấn phím bất kỳ hoặc q để đóng cửa sổ này...'; read -n 1 -s"

# ==============================================================================
# 📐 CHIA & ĐÓNG PANE
# ==============================================================================
# Chia dọc: Prefix + \ hoặc Prefix + | (Tự giữ nguyên thư mục hiện tại)
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Chia ngang: Prefix + - hoặc Prefix + _
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Đóng Pane hiện tại (Prefix + x) không cần hỏi xác nhận
bind x kill-pane

# Phóng to / Thu nhỏ Pane hiện tại (Prefix + z)
bind z resize-pane -Z

# ==============================================================================
# 🧭 ĐIỀU HƯỚNG PANE (CHUYỂN Ô)
# ==============================================================================
# Cách 1 (Trực tiếp không cần Prefix): Alt + Phím mũi tên hoặc Alt + h/j/k/l
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Cách 2 (Có Prefix): Prefix + h/j/k/l hoặc Prefix + Mũi tên
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# ==============================================================================
# 📏 KÉO GIÃN VIỀN PANE (RESIZE)
# ==============================================================================
# Prefix + Shift + H/J/K/L hoặc dùng chuột kéo viền
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# ==============================================================================
# 🪟 QUẢN LÝ TAB / WINDOW
# ==============================================================================
# Tạo Tab mới tại thư mục hiện tại (Prefix + c)
bind c new-window -c "#{pane_current_path}"

# Chuyển Tab trực tiếp: Alt + 1..9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Chuyển Tab qua lại: Shift + Mũi tên Trái / Phải
bind -n S-Left previous-window
bind -n S-Right next-window

# Đổi tên Tab (Prefix + ,)
bind , command-prompt -I "#W" "rename-window '%%'"

# ==============================================================================
# 📋 VIM COPY MODE & SYSTEM CLIPBOARD
# ==============================================================================
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"

# ==============================================================================
# 🖼️ GIAO DIỆN & THANH STATUS BAR TOKYO NIGHT
# ==============================================================================
set -g pane-border-style fg="#24283b"
set -g pane-active-border-style fg="#7aa2f7",bold

set -g message-style bg="#7aa2f7",fg="#15161e",bold
set -g message-command-style bg="#bb9af7",fg="#15161e",bold
set -g popup-border-style fg="#7aa2f7"
set -g popup-border-lines rounded

set -g status on
set -g status-interval 3
set -g status-position bottom
set -g status-justify left
set -g status-style bg="#16161e",fg="#c0caf5"

set -g status-left-length 60
set -g status-right-length 120

# Trái: Session Name + Thư mục
set -g status-left "#[bg=#7aa2f7,fg=#15161e,bold]  #S  #[bg=#24283b,fg=#7dcfff,bold] 📁 #{s|$HOME|~|:pane_current_path} #[bg=#16161e,fg=#24283b] "

# Giữa: Tabs
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89,bg=#16161e] #I:#W "
setw -g window-status-current-format "#[fg=#16161e,bg=#bb9af7]#[fg=#15161e,bg=#bb9af7,bold] #I:#W #{?window_zoomed_flag,🔍 ,}#[fg=#bb9af7,bg=#16161e]"

# Phải: Help + CPU + RAM
set -g status-right "#[fg=#24283b,bg=#16161e]#[fg=#e0af68,bg=#24283b] 💡 ?:Help #[fg=#1f2335,bg=#24283b]#[fg=#7dcfff,bg=#1f2335] ⚡ #(cut -d' ' -f1 /proc/loadavg) #[fg=#16161e,bg=#1f2335]#[fg=#9ece6a,bg=#16161e] 🧠 #(free -m | awk '/^Mem:/ {print $3\"M\"}') "

set-option -g detach-on-destroy off
